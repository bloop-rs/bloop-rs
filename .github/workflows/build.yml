name: Build Artifacts

on:
  push:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: bloop-linux-x64
            binary_path: target/x86_64-unknown-linux-gnu/release/bloop
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: bloop-macos-x64
            binary_path: target/x86_64-apple-darwin/release/bloop
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: bloop-macos-arm64
            binary_path: target/aarch64-apple-darwin/release/bloop
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: bloop-windows-x64
            binary_path: target/x86_64-pc-windows-msvc/release/bloop.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare Artifact
        shell: bash
        run: |
          mkdir -p dist
          cp ${{ matrix.binary_path }} dist/
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/bloop.exe dist/${{ matrix.artifact_name }}.exe
          else
            mv dist/bloop dist/${{ matrix.artifact_name }}
            chmod +x dist/${{ matrix.artifact_name }}
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}*
          if-no-files-found: error
