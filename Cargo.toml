[package]
name = "bloop"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.30.0"
color-eyre = "0.6.3"
crossterm = "0.29.0"
bluebubbles-api = { path = "api" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-width = "0.2.0"
textwrap = "0.16.1"
chrono = { version = "0.4", features = ["serde"] }
emojis = "0.8.1"
ratatui-image = { version = "10.0.8", default-features = false, features = ["image-defaults", "crossterm"] }
image = "0.25"
